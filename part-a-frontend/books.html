<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Books</title>
    <script type="text/javascript" src="assets/js/ui/menu.js"></script>
    <script type="text/javascript" src="assets/js/data/books.js"></script>
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/layout.css">
</head>

<body>
    <div id="sideMenu" class="sidenav">
        <a class="closebtn" onclick="closeNav()">×</a>
        <a href="/part-a-frontend/index.html">Home</a>
        <a href="#">Courses</a>
        <a class="active" href="/part-a-frontend/books.html">Books</a>
        <a href="/part-a-frontend/about.html">About Us</a>
    </div>
    <div id="main">
        <header class="header-bar">
            <span class="sidenav-btn" onclick="openNav()">☰ open</span>
            <h1>Books</h1>
        </header>
        <div class="main-content">
            <aside class="filters">
                <nav class="search-container">
                    <button type="submit">&#128270;</button>
                    <input type="text" placeholder="Search..." name="search">
                </nav>
                <h2>Filters</h2>
                <ul class="filter-list">
                    <li>
                        <label for="available">available</label>
                        <input type="checkbox" id="available">
                    </li>
                    <li>
                        <label for="publicationYear">year of publication</label>
                        <input type="number" max="2025" step="1" value="2025" id="publicationYear">
                    </li>
                    <li>
                        <div class="expanded-content">
                            <button class="dropbtn">courses</button>
                            <ul class="expanded-filter-list" id="courses"></ul>
                        </div>
                    </li>
                    <li>
                        <div class="expanded-content">
                            <button class="dropbtn">publishers</button>
                            <ul class="expanded-filter-list" id="publishers"></ul>
                        </div>
                    </li>
                </ul>
            </aside>
            <ul class="books-list">
                <li id="book"></li>
            </ul>
        </div>
    </div>
</body>

</html>
