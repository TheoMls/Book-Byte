<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Books</title>
    <script type="text/javascript" src="assets/js/ui/menu.js"></script>
    <script type="text/javascript" src="assets/js/data/books.js"></script>
    <script type="text/javascript" src="assets/js/data/courses.js"></script>
    <script type="text/javascript" src="assets/js/books.js"></script>
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/layout.css">
</head>

<body>
    <header class="header-bar">
        <div class="logo-title">
            <span class="sidenav-btn" onclick="openNav('sideMenu')">☰</span>
            <a href="index.html">
                <img src="assets/img/logo.png" width="48" height="48">
            </a>
            <h1>Title</h1>
        </div>
    </header>

    <nav class="topnav">
        <a href="./index.html">Home</a>
        <a href="./courses.html">Courses</a>
        <a class="active" href="./books.html">Books</a>
        <a href="./about.html">About</a>
        <a href="./sign_up.html">Sign Up / Sign In</a>
    </nav>

    <div id="sideMenu" class="sidenav">
        <a class="closebtn" onclick="closeNav('sideMenu')">×</a>
        <a href="./index.html">Home</a>
        <a href="./courses.html">Courses</a>
        <a class="active" href="./books.html">Books</a>
        <a href="./about.html">About Us</a>
        <a href="./sign_up.html">Sign Up / Sign In</a>
    </div>

    <div>
        <header class="header-bar">
            <h1>Books</h1>
            <div class="toolbar">
                <nav class="search-container">
                    <input type="text" placeholder="Search..." name="search">
                    <div class="btn-text">
                        <p class="hide">Search</p>
                        <button type="submit"><img src="assets/img/search-icon.png" style="width:19px; height:19px"
                                alt="Search"></button>
                    </div>
                </nav>
                <div class="btn-text">
                    <p class="hide">Filters</p>
                    <button class="filters-btn" onclick="openNav('filtersList', false)"><img
                            src="assets/img/filter-icon.png" style="width:19px; height:19px" alt="Search"></button>
                </div>
            </div>
        </header>
        <aside class="filters" id="filtersList">
            <h2>Filters</h2>
            <a class="closebtn" onclick="closeNav('filtersList')">×</a>
            <ul class="filter-list">
                <li class="regular-filter">
                    <label for="available">Available</label>
                    <input type="checkbox" id="available">
                </li>
                <li class="regular-filter">
                    <div class="filter-header">
                        <input type="checkbox" id="enablePubYear" onchange="toggleSlider('maxYear', this)">

                        <label for="maxYear">Published up to: <span id="publicationYear">2025</span></label>
                    </div>

                    <input type="range" step="1" value="2025" id="maxYear" disabled
                        oninput="document.getElementById('publicationYear').textContent = this.value">
                </li>
                <li class="expanded-filter">
                    <button class="dropbtn">Courses</button>
                    <ul class="expanded-filter-list" id="courses"></ul>
                </li>
                <li class="expanded-filter">
                    <button class="dropbtn">Publishers</button>
                    <ul class="expanded-filter-list" id="publishers"></ul>
                </li>
            </ul>
            <button class="apply" id="applyBtn">Apply</button>
        </aside>
        <ul class="books-container main-content" id="booksList"></ul>
    </div>
    <div id="overlay" onclick="closeNav('sideMenu')"></div>
</body>

</html>
